# Base configuration, shared by every environment.
http:
  addr: ":8080"
  shutdown_timeout: 30

postgres:
  max_conns: 10

redis:
  db: 0

ocr:
  timeout_sec: 600

providers:
  local:
    base_url: "http://localhost:11434"
  openai:
    base_url: "https://api.openai.com"
  anthropic:
    base_url: "https://api.anthropic.com"

models:
  - id: qwen2.5:3b
    provider: local
    tier: local
    # A floor for before the runtime has been asked. A self-hosted runtime
    # reports what it actually loaded, which depends on the machine's memory,
    # and that figure wins.
    context_window: 4096
    cost_per_1k_in_usd_micros: 0
    cost_per_1k_out_usd_micros: 0
  - id: gpt-4o
    provider: openai
    tier: frontier
    context_window: 128000
    cost_per_1k_in_usd_micros: 2500
    cost_per_1k_out_usd_micros: 10000
  - id: claude-sonnet-5
    provider: anthropic
    tier: frontier
    context_window: 200000
    cost_per_1k_in_usd_micros: 3000
    cost_per_1k_out_usd_micros: 15000
