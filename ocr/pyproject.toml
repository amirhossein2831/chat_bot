[project]
name = "ocr"
version = "0.1.0"
description = "Persian OCR for the chat gateway: page images in, text out"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
]

# Torch and Surya are several gigabytes and their weights come from a CDN that
# is unreachable from Iran, so they are not part of the default install. The
# image bakes them in; everything else here runs without them.
[project.optional-dependencies]
recognizer = ["surya-ocr>=0.6", "torch>=2.4", "pillow>=10.4"]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.13", "ruff>=0.8"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

# Any is banned where the design depends on types being exact. The api and
# settings layers sit on pydantic, whose own base classes carry it.
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.service.*"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["surya.*", "PIL.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
