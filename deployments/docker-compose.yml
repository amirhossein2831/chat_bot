services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  ocr:
    build:
      context: ../ocr
      dockerfile: build/package/ocr.Dockerfile
    environment:
      OCR_RECOGNIZER: surya
    ports: ["8100:8100"]

  gateway:
    build:
      context: ../gateway
      dockerfile: build/package/gateway.Dockerfile
    environment:
      APP_ENV: local
      APP_HTTP_ADDR: ":8080"
      APP_POSTGRES_DSN: "postgres://app:app@postgres:5432/app?sslmode=disable"
      APP_REDIS_ADDR: "redis:6379"
      APP_OBJECTS_ENDPOINT: "minio:9000"
      APP_PROVIDERS_LOCAL_BASE_URL: "http://vllm:8000"
      APP_OCR_BASE_URL: "http://ocr:8100"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ocr: { condition: service_started }

  web:
    build:
      context: ../web
      dockerfile: build/package/web.Dockerfile
    ports: ["3000:80"]
    depends_on: [gateway]

volumes:
  pgdata:
  miniodata:
