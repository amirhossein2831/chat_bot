server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed assets are immutable; the shell must never be cached or a deploy
    # leaves clients on a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streaming: without these the whole SSE response is buffered and
        # delivered in one burst, which looks exactly like a frozen app.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
